name: GitHub Actions runner diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner
        run: |
          echo "Runner started successfully"
          uname -a
          git --version
          test -d .git
          echo "Repository checkout succeeded"
