name: Build iOS tweak template

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git perl make dpkg-dev fakeroot cargo
          cargo install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -exec cp -R {} "$HOME/theos/sdks/" \;
          if ! find "$HOME/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | grep -q .; then
            echo "No iPhoneOS SDK was installed."
            exit 1
          fi

      - name: Compile template
        run: |
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -print

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-overlay-template-package
          path: packages/*
          if-no-files-found: error
